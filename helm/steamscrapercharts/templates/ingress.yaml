apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  annotations: 
    nginx.org/rewrites: "serviceName=webserver rewrite=/; serviceName=auth rewrite=/; serviceName=steamapi rewrite=/"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "512k"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - steamscraper.io
    secretName: tls-cert
  rules:
  - host: localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: webserver
            port:
              number: 443
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth
            port:
              number: 443
      - path: /api/steam
        pathType: Prefix
        backend:
          service:
            name: steamapi
            port:
              number: 443
