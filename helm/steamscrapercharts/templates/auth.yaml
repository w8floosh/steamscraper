apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-server-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      steamscraper.io/name: auth
  template:
    metadata:
      labels:
        steamscraper.io/name: auth
    spec:
      containers:
      - name: auth
        image: {{.Values.ecr}}-auth:{{.Values.tag}}
        ports:
        - containerPort: 443
        volumeMounts:
          - name: certs
            mountPath: "/etc/ssl/certs"
            readOnly: true
        resources:
          limits:
            cpu: "0.5"
            memory: "512Mi"
          requests:
            cpu: "0.1"
            memory: "256Mi"
      nodeSelector:
        group: backend-group

      volumes:
      - name: certs
        secret:
          secretName: tls-cert
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    steamscraper.io/name: auth
  ports:
    - port: 443
  type: LoadBalancer 