apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      steamscraper.io/name: web-server
  template:
    metadata:
      labels:
        steamscraper.io/name: web-server
    spec:
      containers:
      - name: web-server
        image: {{.Values.ecr}}-web:{{.Values.tag}}
        volumeMounts:
        - name: certs
          mountPath: "/etc/ssl/certs"
          readOnly: true
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "0.5"
            memory: "384Mi"
          requests:
            cpu: "0.1"
            memory: "128Mi"
      volumes:
      - name: certs
        secret:
          secretName: tls-cert
      nodeSelector:
        group: frontend-group
---
apiVersion: v1
kind: Service
metadata:
  name: webserver
spec:
  selector:
    steamscraper.io/name: web-server
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer # if you want your service to be accessible from outside the Kubernetes cluster