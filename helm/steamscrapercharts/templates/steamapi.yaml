apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: steamapi-statefulset
spec:
  replicas: 1
  serviceName: steamapi
  selector:
    matchLabels:
      steamscraper.io/name: steamapi
  template:
    metadata:
      labels:
        steamscraper.io/name: steamapi
    spec:
      containers:
      - name: steamapi
        image: {{.Values.ecr}}-steamapi:{{.Values.tag}}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 443
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: STEAMAPI_CG
          value: "STEAMAPI_CG"
        - name: REDIS_REQUEST_TIMEOUT
          value: "3000"
        - name: REDIS_RESPONSE_TIMEOUT
          value: "3000"
        volumeMounts:
        - name: certs
          mountPath: "/etc/ssl/certs"
          readOnly: true
        resources:
          limits:
            cpu: "0.5"
            memory: "384Mi"
          requests:
            cpu: "0.1"
            memory: "128Mi"

      volumes:
      - name: certs
        secret:
          secretName: tls-cert
          items: 
            - key: tls.crt
              path: steamscraper.io.crt
            - key: tls.key
              path: steamscraper.io.key

      nodeSelector:
        group: backend-group

      imagePullSecrets:
        - name: regcred

---
apiVersion: v1
kind: Service
metadata:
  name: steamapi
spec:
  selector:
      steamscraper.io/name: steamapi
  ports:
    - port: 80
      targetPort: 443
  