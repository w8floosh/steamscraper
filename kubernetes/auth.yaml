apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-server-statefulset
  labels:
    app: auth-server
spec:
  replicas: 2
  selector:
    matchLabels:
      steamscraper.io/name: auth-server
  template:
    metadata:
      labels:
        steamscraper.io/name: auth-server
    spec:
      containers:
      - name: auth-server
        image: node:18
        ports:
        - containerPort: 3000
---
# 
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    steamscraper.io/name: auth-server
  ports:
    - port: 3000
      targetPort: 3000