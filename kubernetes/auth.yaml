apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-server-deployment
  labels:
    app: auth-server
spec:
  replicas: 1
  selector:
    matchLabels:
      steamscraper.io/name: auth-server
  template:
    metadata:
      labels:
        steamscraper.io/name: auth-server
    spec:
      containers:
      - name: auth-server
        image: node:18
        ports:
        - containerPort: 443
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    steamscraper.io/name: auth-server
  ports:
    - port: 443
  type: LoadBalancer 