apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-deployment
  labels:
    app: web-server
spec:
  replicas: 1
  selector:
    matchLabels:
      steamscraper.io/name: client
  template:
    metadata:
      labels:
        steamscraper.io/name: client
    spec:
      containers:
      - name: web-server
        image: nginx:latest
        ports:
        - containerPort: 443
---
apiVersion: v1
kind: Service
metadata:
  name: client-service
spec:
  selector:
    steamscraper.io/name: client
  ports:
    - port: 443
  type: LoadBalancer # if you want your service to be accessible from outside the Kubernetes cluster