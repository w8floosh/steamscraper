apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-server-deployment
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      steamscraper.io/name: compute
  template:
    metadata:
      labels:
        steamscraper.io/name: compute
    spec:
      containers:
      - name: compute
        ports:
        - containerPort: 3001 
        image: $(ECR_URL)-backend:latest
        env:
        - name: ECR_URL
          valueFrom: 
            secretKeyRef:
              name: ecr
              key: ECR_URL
        - name: REDIS_HOST
          value: redis  
        - name: REDIS_PORT
          value: "6379"
        - name: BACKEND_CG
          value: BACKEND_CG
        resources:
          limits:
            cpu: "0.5"
            memory: "512Mi"
          requests:
            cpu: "0.1"
            memory: "256Mi"
      nodeSelector:
        group: backend-group
