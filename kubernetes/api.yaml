apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-server-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      steamscraper.io/name: backend-server
  template:
    metadata:
      labels:
        steamscraper.io/name: backend-server
    spec:
      containers:
      - name: backend-server
        image: node:18
        ports:
        - containerPort: 3001 
        env:
        - name: REDIS_HOST
          value: redis  
        - name: REDIS_PORT
          value: "6379"
        - name: BACKEND_CG
        - value: BACKEND_CG
