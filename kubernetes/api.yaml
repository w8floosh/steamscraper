apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-server-deployment
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      steamscraper.io/name: compute
  template:
    metadata:
      labels:
        steamscraper.io/name: compute
    spec:
      containers:
      - name: compute
        image: node:18
        ports:
        - containerPort: 3001 
        env:
        - name: REDIS_HOST
          value: redis  
        - name: REDIS_PORT
          value: "6379"
        - name: BACKEND_CG
        - value: BACKEND_CG
