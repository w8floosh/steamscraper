apiVersion: apps/v1
kind: Deployment
metadata:
  name: steamapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: steamapi
  template:
    metadata:
      labels:
        app: steamapi
    spec:
      containers:
      - name: steamapi
        image: python:latest
        ports:
        - containerPort: 443
        env:
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: "6379"

---
apiVersion: v1
kind: Service
metadata:
  name: steamapi-service
spec:
  selector:
    app.kubernetes.io/name: 
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000