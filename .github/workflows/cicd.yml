name: CI/CD pipeline
on: 
  workflow_dispatch:
    inputs:
      updateImages:
        description: 'Update images'
        type: boolean
        default: true
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: steamscraper
  EKS_CLUSTER: steamscraper-eks
  
jobs:
  testing:
    if: ${{ github.event.inputs.updateImages == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./api
        run: npm install

      - name: Run tests
        working-directory: ./api
        run: npm run test

  build_publish:
    if: ${{ github.event.inputs.updateImages == true }}
    needs: testing
    runs-on: ubuntu-latest
    steps:
        - name: Code checkout
          uses: actions/checkout@v4  

        - name: Configure AWS credentials from the OIDC role
          id: aws-configuration
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: ${{secrets.AWS_ROLE_ARN}}
            aws-region: ${{env.AWS_REGION}}
            role-session-name: steamscraper-cicd
            output-credentials: true

        - name: Build & Upload backend server image to ECR
          uses: kciter/aws-ecr-action@v5
          with:
            access_key_id: ${{ steps.aws-configuration.outputs.aws-access-key-id }}
            secret_access_key: ${{ steps.aws-configuration.outputs.aws-secret-access-key }}
            account_id: ${{ steps.aws-configuration.outputs.aws-account-id }}
            repo: ${{env.ECR_REPOSITORY}}-backend
            create_repo: true
            region: ${{env.AWS_REGION}}
            tags: latest,${{ github.sha }}
            dockerfile: ./api/Dockerfile
            path: ./api
        
        - name: Build & Upload Steam API proxy image to ECR
          uses: kciter/aws-ecr-action@v5
          with:
            access_key_id: ${{ steps.aws-configuration.outputs.aws-access-key-id }}
            secret_access_key: ${{ steps.aws-configuration.outputs.aws-secret-access-key }}
            account_id: ${{ steps.aws-configuration.outputs.aws-account-id }}
            repo: ${{env.ECR_REPOSITORY}}-steamapi
            create_repo: true
            region: ${{env.AWS_REGION}}
            tags: latest,${{ github.sha }}
            dockerfile: ./steamapi/Dockerfile
            path: ./steamapi
        
        - name: Build & Upload web server image to ECR
          uses: kciter/aws-ecr-action@v5
          with:
            access_key_id: ${{ steps.aws-configuration.outputs.aws-access-key-id }}
            secret_access_key: ${{ steps.aws-configuration.outputs.aws-secret-access-key }}
            account_id: ${{ steps.aws-configuration.outputs.aws-account-id }}
            repo: ${{env.ECR_REPOSITORY}}-web
            create_repo: true
            region: ${{env.AWS_REGION}}
            tags: latest,${{ github.sha }}
            dockerfile: ./client/Dockerfile
            path: ./client
        
        - name: Build & Upload auth server image to ECR
          uses: kciter/aws-ecr-action@v5
          with:
            access_key_id: ${{ steps.aws-configuration.outputs.aws-access-key-id }}
            secret_access_key: ${{ steps.aws-configuration.outputs.aws-secret-access-key }}
            account_id: ${{ steps.aws-configuration.outputs.aws-account-id }}
            repo: ${{env.ECR_REPOSITORY}}-auth
            create_repo: true
            region: ${{env.AWS_REGION}}
            tags: latest,${{ github.sha }}
            dockerfile: ./auth/Dockerfile
            path: ./auth
            
  
  deploy:
    runs-on: ubuntu-latest
    needs: build_publish
    steps:
      - name: Code checkout
        uses: actions/checkout@v4  

      - name: Configure AWS credentials from the OIDC role
        id: aws-configuration
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{secrets.AWS_ROLE_ARN}}
          aws-region: ${{env.AWS_REGION}}
          role-session-name: steamscraper-deploy
          output-credentials: true

      - name: Update kubeconfig file
        run: aws eks update-kubeconfig --name ${{env.EKS_CLUSTER}} --region ${{env.AWS_REGION}}

      - name: Login to ECR
        run: aws ecr get-login-password --region ${{env.AWS_REGION}} | docker login --username AWS --password-stdin ${{ steps.aws-configuration.outputs.aws-account-id }}.dkr.ecr.${{env.AWS_REGION}}.amazonaws.com

      - name: Deploy Helm charts
        uses: bitovi/github-actions-deploy-eks-helm@v1.2.10
        with:
          aws-access-key-id: ${{ steps.aws-configuration.outputs.aws-access-key-id }}
          aws-secret-access-key: ${{ steps.aws-configuration.outputs.aws-secret-access-key }}
          aws-region: ${{ env.AWS_REGION }}
          cluster-name: ${{ env.EKS_CLUSTER }}
          chart-path: helm/steamscrapercharts
          values: ecr=${{ steps.aws-configuration.outputs.aws-account-id }}.dkr.ecr.${{env.AWS_REGION}}.amazonaws.com/${{env.ECR_REPOSITORY}},tag=latest
          name: steamscraper-stack  
