name: CI/CD pipeline
on: workflow_dispatch
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout
env:
    AWS_REGION: us-east-1
    ECR_REPOSITORY: steamscraper
    ECR_PUBLIC_URI: public.ecr.aws/t4o5y2a8/steamscraper
    EKS_CLUSTER: steamscraper-eks

jobs:
    
    build_publish:
        # needs: Testing
        runs-on: ubuntu-latest
        steps:
            - name: Code checkout
              uses: actions/checkout@v4  

            - name: Configure AWS credentials from the OIDC role
              id: aws-configuration
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: ${{secrets.AWS_ROLE_ARN}}
                aws-region: ${{env.AWS_REGION}}
                role-session-name: steamscraper-cicd
                output-credentials: true

            - name: Build & Upload backend server image to ECR
              uses: docker://ghcr.io/kciter/aws-ecr-action:latest
              with:
                access_key_id: ${{ steps.aws-configuration.outputs.aws-access-key-id }}
                secret_access_key: ${{ steps.aws-configuration.outputs.aws-secret-access-key }}
                account_id: ${{ steps.aws-configuration.outputs.aws-account-id }}
                repo: ${{env.ECR_PUBLIC_URI}}
                region: ${{env.AWS_REGION}}
                tags: latest,${{ github.sha }}
                image_scanning_configuration: true
                dockerfile: ./api/Dockerfile
                  
            
            
            - name: Build & Upload Steam API proxy image to ECR
              uses: docker://ghcr.io/kciter/aws-ecr-action:latest
              with:
                access_key_id: ${{ steps.aws-configuration.outputs.aws-access-key-id }}
                secret_access_key: ${{ steps.aws-configuration.outputs.aws-secret-access-key }}
                account_id: ${{ steps.aws-configuration.outputs.aws-account-id }}
                repo: ${{env.ECR_PUBLIC_URI}}
                region: ${{env.AWS_REGION}}
                tags: latest,${{ github.sha }}
                image_scanning_configuration: true
                dockerfile: ./steamapi/Dockerfile
            
            - name: Build & Upload web server image to ECR
              uses: docker://ghcr.io/kciter/aws-ecr-action:latest
              with:
                access_key_id: ${{ steps.aws-configuration.outputs.aws-access-key-id }}
                secret_access_key: ${{ steps.aws-configuration.outputs.aws-secret-access-key }}
                account_id: ${{ steps.aws-configuration.outputs.aws-account-id }}
                repo: ${{env.ECR_PUBLIC_URI}}
                region: ${{env.AWS_REGION}}
                tags: latest,${{ github.sha }}
                image_scanning_configuration: true
                dockerfile: ./client/Dockerfile
            
            - name: Build & Upload auth server image to ECR
              uses: docker://ghcr.io/kciter/aws-ecr-action:latest
              with:
                access_key_id: ${{ steps.aws-configuration.outputs.aws-access-key-id }}
                secret_access_key: ${{ steps.aws-configuration.outputs.aws-secret-access-key }}
                account_id: ${{ steps.aws-configuration.outputs.aws-account-id }}
                repo: ${{env.ECR_PUBLIC_URI}}
                region: ${{env.AWS_REGION}}
                tags: latest,${{ github.sha }}
                image_scanning_configuration: true
                dockerfile: ./auth/Dockerfile
                
            - name: Build & Upload Redis server image to ECR
              uses: docker://ghcr.io/kciter/aws-ecr-action:latest
              with:
                access_key_id: ${{ steps.aws-configuration.outputs.aws-access-key-id }}
                secret_access_key: ${{ steps.aws-configuration.outputs.aws-secret-access-key }}
                account_id: ${{ steps.aws-configuration.outputs.aws-account-id }}
                repo: ${{env.ECR_PUBLIC_URI}}
                region: ${{env.AWS_REGION}}
                tags: latest,${{ github.sha }}
                image_scanning_configuration: true
                dockerfile: ./redis/Dockerfile
                
